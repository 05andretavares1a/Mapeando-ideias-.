<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Validação de Protótipo do App de Estudos</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .option-card {
            transition: all 0.2s ease-in-out;
        }
        .option-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header principal -->
    <header class="max-w-3xl mx-auto w-full text-center my-6">
        <div class="inline-block bg-indigo-500/10 text-indigo-400 text-xs font-semibold uppercase tracking-widest px-3 py-1 rounded-full mb-3 border border-indigo-500/20">
            Teste de Usabilidade
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
            Quiz do Protótipo de Estudos
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">
            Avalie o entendimento das funcionalidades principais desenhadas para a nova tela.
        </p>
    </header>

    <!-- Conteúdo principal do Quiz -->
    <main class="max-w-2xl mx-auto w-full flex-grow flex flex-col justify-center">
        <!-- Container onde as perguntas ou os resultados serão inseridos -->
        <div id="quiz-card" class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 md:p-8 shadow-xl backdrop-blur-sm relative overflow-hidden">
            
            <!-- Barra de Progresso superior -->
            <div id="progress-bar-container" class="w-full bg-slate-700/50 rounded-full h-2.5 mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-2.5 rounded-full transition-all duration-300 w-0"></div>
            </div>

            <!-- Área dinâmica para renderização da pergunta -->
            <div id="quiz-content">
                <!-- Conteúdo gerado via JS -->
            </div>
        </div>
    </main>

    <footer class="max-w-3xl mx-auto w-full text-center mt-8 text-xs text-slate-500">
        <p>Validação de Usabilidade • Design de Interface de Aprendizagem</p>
    </footer>

    <script>
        // Dados das perguntas com respostas e explicações detalhadas
        const quizData = [
            {
                id: 1,
                pergunta: "Qual é a principal finalidade da tela apresentada no protótipo?",
                opcoes: [
                    "Centralizar e organizar diferentes tipos de materiais de estudo de uma aula.",
                    "Funcionar como uma rede social para conversar com outros alunos.",
                    "Realizar o pagamento de mensalidades e mensalidades de cursos."
                ],
                correta: 0,
                explicacao: "O objetivo principal é oferecer um hub organizado com todos os recursos multimídia necessários para o acompanhamento da matéria."
            },
            {
                id: 2,
                pergunta: "Quais tipos de formatos de mídia o aplicativo permite visualizar na lista?",
                opcoes: [
                    "PDFs, vídeos, fotos de lousa e anotações pessoais.",
                    "Apenas arquivos de áudio e podcasts curtos.",
                    "Somente transmissões ao vivo de professores da instituição."
                ],
                correta: 0,
                explicacao: "O aplicativo oferece suporte multimídia completo para atender a diferentes estilos de aprendizado."
            },
            {
                id: 3,
                pergunta: "Como o usuário pode encontrar rapidamente um arquivo específico dentro de um tema de estudo?",
                opcoes: [
                    "Usando a barra de pesquisa ou filtrando pelos botões de categoria de mídia.",
                    "Excluindo os outros materiais até sobrar o arquivo desejado na tela.",
                    "Reiniciando o aplicativo para recarregar a ordem da lista."
                ],
                correta: 0,
                explicacao: "Filtros rápidos por tipo e a barra de busca textual garantem agilidade na localização de materiais."
            },
            {
                id: 4,
                pergunta: "O que indica o componente visual de progresso localizado no topo da lista?",
                opcoes: [
                    "A quantidade de materiais daquele tópico que o aluno já revisou.",
                    "O limite de espaço de armazenamento disponível no celular.",
                    "A velocidade atual da conexão de internet."
                ],
                correta: 0,
                explicacao: "O indicador ajuda o aluno a acompanhar visualmente o quanto já estudou do conteúdo programado."
            },
            {
                id: 5,
                pergunta: "Para que serve a opção de alternar visualização ao lado da barra de busca?",
                opcoes: [
                    "Alternar entre o modo de exibição em lista ou em grade/mosaico.",
                    "Ativar ou desativar o som dos vídeos contidos na lista.",
                    "Mudar o idioma padrão de navegação do aplicativo."
                ],
                correta: 0,
                explicacao: "Permite adaptar a visualização entre lista compacta ou grade visual, conforme a preferência do usuário."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = [];

        function loadQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const progressBar = document.getElementById('progress-bar');
            const item = quizData[currentQuestion];

            // Atualizar barra de progresso
            const progressPercentage = ((currentQuestion) / quizData.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;

            let html = `
                <div class="flex items-center justify-between text-xs text-indigo-400 font-medium mb-2">
                    <span>PERGUNTA ${currentQuestion + 1} DE ${quizData.length}</span>
                </div>
                <h2 class="text-xl md:text-2xl font-bold text-white mb-6 leading-snug">
                    ${item.pergunta}
                </h2>
                <div class="space-y-3">
            `;

            item.opcoes.forEach((opcao, index) => {
                html += `
                    <button onclick="selectOption(${index})" class="option-card w-full text-left p-4 rounded-xl bg-slate-700/40 hover:bg-slate-700 border border-slate-600/50 hover:border-indigo-500/50 text-slate-200 text-sm md:text-base flex items-start gap-3 group">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-800 text-slate-400 text-xs font-bold group-hover:bg-indigo-600 group-hover:text-white transition-colors shrink-0 mt-0.5">
                            ${String.fromCharCode(65 + index)}
                        </span>
                        <span class="flex-grow">${opcao}</span>
                    </button>
                `;
            });

            html += `</div>`;
            quizContent.innerHTML = html;
        }

        function selectOption(index) {
            const item = quizData[currentQuestion];
            const isCorrect = index === item.correta;

            if (isCorrect) {
                score++;
            }

            userAnswers.push({
                question: item.pergunta,
                selectedOption: index,
                correctOption: item.correta,
                isCorrect: isCorrect,
                explanation: item.explicacao,
                options: item.opcoes
            });

            currentQuestion++;

            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const quizContent = document.getElementById('quiz-content');
            const progressBar = document.getElementById('progress-bar');
            
            // Preencher progresso completo
            progressBar.style.width = '100%';

            const percentage = Math.round((score / quizData.length) * 100);
            
            let message = "";
            let colorClass = "";
            if (percentage >= 80) {
                message = "Excelente! Você compreendeu perfeitamente o protótipo.";
                colorClass = "text-emerald-400";
            } else if (percentage >= 60) {
                message = "Bom trabalho! Teve um bom entendimento da interface.";
                colorClass = "text-amber-400";
            } else {
                message = "Vale a pena revisar o protótipo para esclarecer alguns pontos.";
                colorClass = "text-rose-400";
            }

            let html = `
                <div class="text-center py-4">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-700/60 border border-slate-600 mb-4">
                        <span class="text-3xl font-extrabold ${colorClass}">${percentage}%</span>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-1">Resultado Final</h2>
                    <p class="${colorClass} text-sm font-semibold mb-2">${message}</p>
                    <p class="text-slate-400 text-xs mb-6">Você acertou ${score} de ${quizData.length} perguntas.</p>

                    <div class="border-t border-slate-700 pt-6 text-left space-y-4 max-h-[320px] overflow-y-auto pr-1">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Revisão das Respostas</h3>
            `;

            userAnswers.forEach((ans, idx) => {
                html += `
                    <div class="p-4 rounded-xl ${ans.isCorrect ? 'bg-emerald-950/30 border border-emerald-500/30' : 'bg-rose-950/30 border border-rose-500/30'} text-xs">
                        <p class="font-bold text-slate-200 mb-1">${idx + 1}. ${ans.question}</p>
                        <p class="mb-1 ${ans.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                            <strong>Sua resposta:</strong> ${ans.options[ans.selectedOption]}
                        </p>
                        ${!ans.isCorrect ? `
                            <p class="text-emerald-400 mb-1">
                                <strong>Resposta correta:</strong> ${ans.options[ans.correctOption]}
                            </p>
                        ` : ''}
                        <p class="text-slate-400 mt-2 text-[11px] italic bg-slate-900/40 p-2 rounded border border-slate-800">
                            💡 ${ans.explanation}
                        </p>
                    </div>
                `;
            });

            html += `
                    </div>

                    <button onclick="restartQuiz()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-indigo-600/30 text-sm">
                        Refazer Quiz
                    </button>
                </div>
            `;

            quizContent.innerHTML = html;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
            loadQuestion();
        }

        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
